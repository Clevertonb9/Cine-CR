/* ---------- cache isolado por UID ---------- */
/* Considera dados úteis apenas quando há conteúdo real; protege cópias de listas vazias. */
function hasStoredData(value){

  if(Array.isArray(value)) return value.length>0;
  if(typeof value==="object") return Object.keys(value).some(function(k){ return hasStoredData(value[k]); });
  if(typeof value==="string") return value.length>0;
  if(typeof value==="number") return value!==0;
  if(typeof value==="boolean") return value;
  return false;
}
function rawHasStoredData(raw){
  if(raw==null || raw==="") return false;
  try{ return hasStoredData(JSON.parse(raw)); }catch(e){ return true; }
}
function stashCurrentToPerUID(uid){

    if(!rawHasStoredData(raw)) return;

function restorePerUIDToLegacy(uid){

    var current=readRaw(key);

    if(rawHasStoredData(current)) return;
    suppress=true;
    try{ window.localStorage.setItem(key, backup); restored=true; }catch(e){}

function clearLegacy(){

/* ---------- Firestore com chunking versionado (limite 1 MiB/doc) ---------- */
var CHUNK_ARRAY=400, CHUNK_OBJ=100, CHUNK_ITEMS=800;

var BATCH_LIMIT=450;

async function writeChunked(base,docId,payload){

async function readChunked(base,docId){
  var snap=await base.doc(docId).get(); if(!snap.exists)return null;
  var data=snap.data()||{}, chunks=data.chunks||{}, fields=Object.keys(chunks);
  if(!fields.length)return data;

    var field=fields[ci],n=Number(chunks[field])||0,isObj=false,arr=[],obj={};
    var names=Array.from({length:n},function(_,i){return data.generation?versionedChunkName(docId,data.generation,field,i):chunkName(docId,field,i);});

    if(snaps.some(function(cs){return !cs.exists;})) throw new Error("Dados incompletos no Firestore: "+docId+"/"+field+". A sincronização foi interrompida para proteger seus dados.");

var TAB_ID="tab-"+Math.random().toString(36).slice(2,10)+"-"+Date.now();
var LAST_SYNC_KEY=function(uid,docId){ return "cinecr_last_sync_"+uid+"_"+docId; };
function getLastSync(docId){

  try{ var v=window.localStorage.getItem(LAST_SYNC_KEY(currentUser.uid,docId)); return v?JSON.parse(v):null; }catch(e){ return null; }
}
function setLastSync(docId, payload, revision){
  if(!currentUser) return;
  suppress=true; try{ window.localStorage.setItem(LAST_SYNC_KEY(currentUser.uid,docId), JSON.stringify({payload:payload, revision:Number(revision)||0})); }catch(e){} suppress=false;
}
function removedKeys(lastArr, curArr, keyFn){
  var cur={}; (curArr||[]).forEach(function(x){ cur[keyFn(x)]=1; });
  var out=[]; (lastArr||[]).forEach(function(x){ var k=keyFn(x); if(!cur[k]) out.push(k); });
  return out;
}
function filterRemovedArr(arr, removedSet, keyFn){

  var rm={}; removedSet.forEach(function(k){ rm[k]=1; });
  return (arr||[]).filter(function(x){ return !rm[keyFn(x)]; });
}
function keyStr(x){ return typeof x==="string"?x:JSON.stringify(x); }
function keyQuero(x){ return x.media_type+":"+String(x.tmdbId); }
async function fetchCloudAll(){
  var base=db.collection("users").doc(currentUser.uid).collection("data");
  var cloud={};
  var fav=await readChunked(base,"favoritos"); if(fav) cloud.favoritos=fav;
  var as=await readChunked(base,"assistidos"); if(as) cloud.assistidos=as;

function mergeCloudIntoLocal(cloud){
  // Aplica remocoes locais (itens que existiam no ultimo sync e sumiram localmente)
  // antes da uniao, para que outro dispositivo nao ressuscite o que foi removido aqui.

  var localFav=readLocal("cinecr_favoritos")||[];

  var remFav=lastFav?removedKeys(lastFav.payload&&lastFav.payload.items, localFav, keyStr):[];

    var remMovies=removedKeys(lastAs.payload.movies, (readLocal("cinecr_assistidos_v1")||{}).movies, keyStr);
    var remEps=removedKeys(lastAs.payload.episodes, (readLocal("cinecr_assistidos_v1")||{}).episodes, keyStr);

  }
  if(!same(mergedAs, readLocal("cinecr_assistidos_v1"))){ writeLocal("cinecr_assistidos_v1",mergedAs); changed=true; }
  var mergedQ=mergeQuero(readLocal("cinecr_quero_assistir_v1"), cloud.quero_ver?cloud.quero_ver.items:[]);
  var remQ=lastQ?removedKeys(lastQ.payload&&lastQ.payload.items, readLocal("cinecr_quero_assistir_v1")||[], keyQuero):[];
  if(remQ.length){ var rmQ={}; remQ.forEach(function(k){ rmQ[k]=1; }); mergedQ=mergedQ.filter(function(it){ return !rmQ[keyQuero(it)]; }); }
  if(!same(mergedQ, readLocal("cinecr_quero_assistir_v1")||[])){ writeLocal("cinecr_quero_assistir_v1",mergedQ); changed=true; }
  var localHist={filmes:readLocal("cinecr_hist_filmes")||[], series:readLocal("cinecr_hist_series")||[]};

  if(remHF.length){ var r1={}; remHF.forEach(function(k){ r1[k]=1; }); mergedHist.filmes=mergedHist.filmes.filter(function(m){ return !r1[m]; }); }

async function writeLocalToCloud(){
  var base=db.collection("users").doc(currentUser.uid).collection("data");
  var i1=await writeChunked(base, "favoritos", localToCloud("cinecr_favoritos")); setLastSync("favoritos", localToCloud("cinecr_favoritos"), i1.revision);
  var i2=await writeChunked(base, "assistidos", localToCloud("cinecr_assistidos_v1")); setLastSync("assistidos", localToCloud("cinecr_assistidos_v1"), i2.revision);
  var i3=await writeChunked(base, "quero_ver", localToCloud("cinecr_quero_assistir_v1")); setLastSync("quero_ver", localToCloud("cinecr_quero_assistir_v1"), i3.revision);
  var i4=await writeChunked(base, "historico", localToCloud("cinecr_hist_filmes")); setLastSync("historico", localToCloud("cinecr_hist_filmes"), i4.revision);
  await base.doc("perfil").set({displayName:(function(){try{return localStorage.getItem("cinecr_profile_name")||currentUser.displayName||""}catch(e){return currentUser.displayName||""}})(),email:currentUser.email||"",photoURL:currentUser.photoURL||"",updatedAt:firebase.firestore.FieldValue.serverTimestamp()});

function broadcastSync(){
  var msg={uid:currentUser?currentUser.uid:null, ts:Date.now(), source:TAB_ID};
  try{ if(typeof BroadcastChannel!=="undefined"){ var ch=new BroadcastChannel("cinecr-sync"); ch.postMessage(msg); ch.close(); } }catch(e){}
  suppress=true; try{ window.localStorage.setItem("cinecr_sync_broadcast", JSON.stringify(msg)); }catch(e){} suppress=false;
}
async function saveAllToCloud(){

    // Isso impede que uma gravacao antiga sobrescreva dados mais recentes de outra aba/dispositivo.
    var fetched=await fetchCloudAll();
    var cloud=fetched.cloud;
    var hasNewer=false;
    ["favoritos","assistidos","quero_ver","historico"].forEach(function(docId){
      var last=getLastSync(docId);
      var cloudAt=cloud[docId]?cloud[docId].revision||0:0;
      if(last && cloudAt>(last.revision||0)) hasNewer=true;
      if(!last && cloud[docId]) hasNewer=true;

function scheduleSave(){ if(!currentUser||!db||switching||!syncEnabled||suppress) return; pendingSave=true; setDot("#f59e0b"); if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(function(){ saveAllToCloud(); },800); }

    var hasCloud=!!(cloud.favoritos||cloud.assistidos||cloud.quero_ver||cloud.historico);

      var curFav=readLocal("cinecr_favoritos")||[];
      if(!same(curFav,(cloud.favoritos||{}).items||[])) needWrite=true;
      var curAs=readLocal("cinecr_assistidos_v1")||{};
      if(cloud.assistidos && !same({movies:curAs.movies||[],episodes:curAs.episodes||[],movieMeta:curAs.movieMeta||{},seriesMeta:curAs.seriesMeta||{}},{movies:cloud.assistidos.movies||[],episodes:cloud.assistidos.episodes||[],movieMeta:cloud.assistidos.movieMeta||{},seriesMeta:cloud.assistidos.seriesMeta||{}})) needWrite=true;
      if(!same(readLocal("cinecr_quero_assistir_v1")||[],(cloud.quero_ver||{}).items||[])) needWrite=true;

      setLastSync("quero_ver", localToCloud("cinecr_quero_assistir_v1"), (cloud.quero_ver||{}).revision||0);

}

/* Cache por sessão: evita requisições duplicadas da mesma coleção/página. */
var CINE_COLECAO_CACHE=new Map();
async function cineColecaoPage(def,page){
 let key=def.kind==="collection"?("col:"+def.ids):("disc:"+def.qs+"|"+page);
 if(CINE_COLECAO_CACHE.has(key))return CINE_COLECAO_CACHE.get(key);
 let url=def.kind==="collection"?yt+"?action=collection&ids="+encodeURIComponent(def.ids)+"&language=pt-BR":_v.replace("PAGINA",String(page))+def.qs;
 if(!url.startsWith(yt))throw Error("URL coleção inválida");
 let r=await fetch(url);if(!r.ok)throw Error("Falha coleção");
 let z=await r.json();
 let items=hu(z).map(C=>ne(C)).filter(Boolean).filter(m=>m.media_type!=="tv"&&m.posterUrl);
 let seen=new Set(),out=[];
 for(let m of items){if(seen.has(m.id))continue;seen.add(m.id);out.push(m)}
 CINE_COLECAO_CACHE.set(key,out);
 return out;
}
/* Carrega N páginas e, se faltar resultado, completa com a consulta de reserva (fallback). */
async function cineColecaoLoad(def,pages){
 await cineHomeTopReady();
 let out=[]; let seen=new Set();
 let maxPg = pages===1 ? 5 : pages;
 for(let pg=1; pg<=maxPg; pg++){
  let it = await cineColecaoPage(def, pg);
  if(def.kind==="collection"){ out = cineHomeClaim(def.id, it); break; }
  let fresh = it.filter(m=>!seen.has(m.id));
  for(let m of fresh) seen.add(m.id);
  out = out.concat(cineHomeClaim(def.id, fresh));
  if(pages===1 && out.length>=8) break;
 }
 if(out.length<8 && def.fallbackQs){
  let fb = await cineColecaoPage({kind:"discover", qs:def.fallbackQs, id:def.id+":fb"}, 1);
  let fbFresh = fb.filter(m=>!seen.has(m.id));
  out = out.concat(cineHomeClaim(def.id, fbFresh));
 }
 return out;
}
